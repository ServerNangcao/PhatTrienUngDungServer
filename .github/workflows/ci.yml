# ──────────────────────────────────────────────────────────
# CI Pipeline — Ticketing Modular Monolith
# Runs on every push and PR to main/develop
# Steps: restore → build → arch tests → docker build
# ──────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, Test & Architecture Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore -c Release

      - name: Run Architecture Tests
        run: dotnet test tests/Architecture.Tests/Architecture.Tests.csproj --no-build -c Release --verbosity normal

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t ticketing-api:ci .

      # Kiểm tra csproj trong Dockerfile — nếu thêm project mới mà quên thêm COPY thì fail ở đây
      - name: Verify container starts
        run: |
          docker run -d --name ci-test \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ASPNETCORE_URLS=http://+:8080 \
            ticketing-api:ci
          sleep 5
          docker logs ci-test
          docker stop ci-test
          docker rm ci-test
